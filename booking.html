<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dragon jeds - บันทึกการจอง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Navigation Bar -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <span class="text-2xl font-bold text-blue-600 tracking-wide">DRAGON JEDS</span>
            </a>
            <div class="space-x-2">
                <a href="index.html" class="px-4 py-2 text-sm font-medium hover:text-blue-600 transition">หน้าหลัก</a>
                <a href="booking.html" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg shadow-sm">จองรอบทันที</a>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <div class="py-10 px-4">
        <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-md p-6 sm:p-8 border border-slate-100">
            <div class="mb-6 flex justify-between items-center pb-4 border-b border-slate-100">
                <h1 class="text-2xl font-bold text-slate-800">ฟอร์มบันทึกการจอง</h1>
                <a href="index.html" class="text-sm font-medium text-blue-600 hover:text-blue-700 hover:underline">← กลับหน้าหลัก</a>
            </div>

            <form id="bookingForm" onsubmit="submitData(event)" class="space-y-4">
                
                <!-- วันที่เดินทาง & รอบเวลา -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">วันที่เดินทาง</label>
                        <input type="date" id="bookingDate" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">รอบเวลา</label>
                        <input type="text" id="departureTime" placeholder="เช่น 08:00" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- ชื่อบริษัท -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-700">ชื่อบริษัท / คณะ</label>
                    <input type="text" id="companyName" placeholder="กรอกชื่อบริษัท / คณะ" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <!-- ผู้ติดต่อ & เบอร์โทร -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">ผู้ติดต่อ</label>
                        <input type="text" id="contactName" placeholder="ชื่อผู้ติดต่อ" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">เบอร์โทร</label>
                        <input type="tel" id="contactPhone" placeholder="08X-XXX-XXXX" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- จำนวนคน & จำนวนไกด์ -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">จำนวนคน</label>
                        <input type="number" id="paxCount" min="1" value="1" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-slate-700">จำนวนไกด์</label>
                        <input type="number" id="guideCount" min="0" value="0" required class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- ปุ่มบันทึก -->
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition duration-200 shadow-md mt-6">
                    บันทึกข้อมูลการจอง
                </button>
            </form>

            <div id="successMsg" class="hidden mt-4 p-4 bg-emerald-100 border border-emerald-200 text-emerald-800 rounded-lg text-center font-semibold">
                บันทึกข้อมูลการจองเรียบร้อยแล้ว!
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpRuzC4jtcp-Mrob4PJe25TUEPhpUTSoBJZ53a4g-if_m77OLRr_aFDqLV9EnUK0yb2A/exec";

        document.getElementById('bookingDate').value = new Date().toISOString().split('T')[0];

        async function submitData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'กำลังบันทึก...';

            const payload = {
                bookingId: 'BK-' + Math.floor(100000 + Math.random() * 900000),
                bookingDate: document.getElementById('bookingDate').value,
                departureTime: document.getElementById('departureTime').value,
                companyName: document.getElementById('companyName').value,
                contactName: document.getElementById('contactName').value,
                contactPhone: document.getElementById('contactPhone').value,
                paxCount: document.getElementById('paxCount').value,
                guideCount: document.getElementById('guideCount').value
            };

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('bookingForm').reset();
                document.getElementById('bookingDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('guideCount').value = "0";
                document.getElementById('successMsg').classList.remove('hidden');

                setTimeout(() => {
                    document.getElementById('successMsg').classList.add('hidden');
                }, 4000);

            } catch (err) {
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } finally {
                btn.disabled = false;
                btn.innerText = 'บันทึกข้อมูลการจอง';
            }
        }
    </script>
</body>
</html>
